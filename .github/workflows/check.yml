# Pull request checks (RFC-0015 "Pull request checks"). Runs on pull_request only, never
# pull_request_target: the pull request's code runs with a read-only token and no secrets.
# The sync and re-verification jobs dispatch this workflow for their own pull request
# branches (pull requests opened with GITHUB_TOKEN don't trigger pull_request runs); the
# check runs then attach to the branch's head commit like any other.
name: check

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: check-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: registry checks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - name: Install the tools and the pinned SDK
        run: |
          npm ci --prefix tools --ignore-scripts --no-audit --no-fund
          tools/install-sdk.sh "$RUNNER_TEMP/sdk"
      - name: Scope (git only)
        env:
          EVENT: ${{ github.event_name }}
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
          PR_ASSOCIATION: ${{ github.event.pull_request.author_association }}
          PR_HEAD_REF: ${{ github.event.pull_request.head.ref }}
          ACTOR: ${{ github.actor }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          # A pull_request run checks out the merge commit: its first parent is the base
          # branch as merged, so the diff is exactly the pull request's change.
          if [ "$EVENT" = pull_request ]; then
            base=HEAD^1 author=$PR_AUTHOR association=$PR_ASSOCIATION head_ref=$PR_HEAD_REF
          else
            base=origin/main author=$ACTOR association=NONE head_ref=$REF_NAME
          fi
          node tools/check-pr.mjs scope --base "$base" --author "$author" \
            --association "$association" --head-ref "$head_ref" --work "$RUNNER_TEMP/check"
      - name: Download (network)
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node tools/check-pr.mjs fetch --work "$RUNNER_TEMP/check"
      # The archive checks run without network: a new network namespace (loopback only, down)
      # entered as root, then dropped back to the runner user. No token reaches this step.
      - name: Check (no network)
        run: |
          sudo unshare --net -- setpriv --reuid="$(id -u)" --regid="$(id -g)" --clear-groups -- \
            env -i PATH="$PATH" HOME="$HOME" GITHUB_ACTIONS=true \
              GITHUB_STEP_SUMMARY="$GITHUB_STEP_SUMMARY" HYPRUNE_REGISTRY_SDK="$RUNNER_TEMP/sdk" \
            "$(command -v node)" tools/check-pr.mjs verify --work "$RUNNER_TEMP/check" --expect-offline

  tools:
    name: tool tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - name: Install the tools and the pinned SDK
        run: |
          npm ci --prefix tools --ignore-scripts --no-audit --no-fund
          tools/install-sdk.sh "$RUNNER_TEMP/sdk"
      - name: Test
        env:
          HYPRUNE_REGISTRY_SDK: ${{ runner.temp }}/sdk
        run: node --test tools/test/
