# Daily: regenerate entries/official/ from the meta repository's pins
# (hyprune/hyprune worlds/releases.json, libraries/releases.json and libraries/optional.json) and push
# the branch sync-official/pins when anything changed. The organisation doesn't let Actions
# open pull requests, so a release maintainer opens it from that branch; the check accepts it
# when entries/official/ equals a fresh sync at its base (tools/check-pr.mjs, check 15).
name: sync-official

on:
  schedule:
    - cron: '41 5 * * *'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: read
  actions: write

concurrency:
  group: sync-official
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - run: npm ci --prefix tools --ignore-scripts --no-audit --no-fund
      - name: Sync from the pins
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node tools/sync-official.mjs --summary "$RUNNER_TEMP/summary.md"
      - name: Push the branch
        env:
          GH_TOKEN: ${{ github.token }}
          BRANCH: sync-official/pins
        run: |
          cat "$RUNNER_TEMP/summary.md" >> "$GITHUB_STEP_SUMMARY"
          if [ -z "$(git status --porcelain entries/official)" ]; then echo "Official entries are up to date."; exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git switch -C "$BRANCH"
          git add entries/official
          git commit -q -m "Sync official entries from the meta repository pins"
          git push --force origin "$BRANCH"
          if [ -z "$(gh pr list --head "$BRANCH" --state open --json number --jq '.[].number')" ]; then
            echo "::notice::Pushed $BRANCH: a maintainer opens the pull request (gh pr create -R $GITHUB_REPOSITORY --head $BRANCH --title 'Sync official entries')"
            echo "Pushed \`$BRANCH\`: open the pull request from it (Actions may not open pull requests here)." >> "$GITHUB_STEP_SUMMARY"
          fi
          gh workflow run check.yml --ref "$BRANCH"
